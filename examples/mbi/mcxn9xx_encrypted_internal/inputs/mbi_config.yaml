# ==================  Master Boot Image configuration for mcxn946 (signed, internal XIP)  ==================
# The image itself is a normal signed MBI. On-chip flash encryption (NPX/PRINCE) is enabled through
# the CMPA configuration - the ROM/flash controller encrypts the selected flash sectors on the fly,
# so no separate encrypted image artifact is produced here.
family: mcxn946
revision: latest
outputImageExecutionTarget: xip
outputImageAuthenticationType: signed
masterBootOutputFile: ../workspace/mcxn9xx_signed.bin
inputImageFile: frdm_mcxn947_led_blinky.bin
outputImageExecutionAddress: 0
certBlock: cert_block_mcxn9xx.yaml
signer: ../../_data/keys/ecc256/srk0_ecc256.pem
