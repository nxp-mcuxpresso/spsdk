# ====================  Debug Credential configuration file for mimx9596, Revision: latest family.  ====================

# ======================================================================================================================
#                                                 == General Options ==                                                 
# ======================================================================================================================
# -------------------------------------===== The chip family name [Required] =====--------------------------------------
# Description: NXP chip family identifier.
family: mimx9596
# -----------------------------------------===== MCU revision [Optional] =====------------------------------------------
# Description: Revision of silicon. The 'latest' name, means most current revision.
# Possible options: <a0, a1, b0, latest>
revision: latest
# ======================================================================================================================
#                                             == Debug Credential Content ==                                            
# ======================================================================================================================
# -------------------------------------------===== SoC Usage [Required] =====-------------------------------------------
# Description: A CC (constraint) value that is a bit mask, and whose bits are used in an SoCC-specific manner. These
# bits are typically used for controlling which debug domains are accessed via the authentication protocol, but device-
# specific debug options can be managed in this way also.
cc_socu: '0x00FFFFF0'
# ======================================================================================================================
#                                         == IEE Clear Regions Configuration ==                                         
# ======================================================================================================================
# -------------------------------------===== IEE Regions to Clear [Optional] =====--------------------------------------
# Description: Bitmask of IEE regions to clear before opening debug access during debug authentication. Each bit
# represents one IEE region - Bit 0 = Region 0, Bit 1 = Region 1, etc. IEE regions are initialized with random keys
# generated by EdgeLock Secure Enclave. Clearing regions before debug access ensures that encrypted memory regions are
# properly handled during the debug authentication process. Even if a region is locked, debug authentication will clear
# it if requested through this bitmask.
iee_clear_regions: '0x00'
# ======================================================================================================================
#                                   == Configuration of AHAB Container Certificate ==                                   
#                                           Certificate container definition."                                          
# ======================================================================================================================
# ------------------------------------------===== Device UUID [Optional] =====------------------------------------------
# Description: Optional 128-bit IETF RFC4122 compliant non-sequential Universally Unique Identifier (UUID)
uuid: '00000000000000000000000000000000'
# ------------------------------===== Fuse/PFR monotonic counter version [Optional] =====-------------------------------
# Description: The fuse version serves as a monotonic counter for anti-rollback protection, but its exact
# implementation and validation mechanism depends on the target device type and certification purpose.

# **For MPU devices (i.MX series):**
# The fuse version is compared against a monotonic counter implemented directly in hardware fuses.
# The value must be equal to or greater than the version stored in fuses to allow loading this container.

# **For MCU devices (e.g., MCXN556S):**
# The fuse version validation depends on the specific feature being certified:

# - **Debug Authentication:** The fuse version is validated against the monotonic counter
#   "Vendor usage" located in the CFPA (Customer Field Programmable Area) PFR page.

# - **Bootable Image Certification:** The fuse version is validated against the
#   IMAGE_KEY_REVOCATION_ID, which is a combination of both CFPA and OTP fuse data:
#   `CFPA.IMAGE_KEY_REVOKE[23:0] | OTP.IMAGE_KEY_REVOKE[7:0] << 24`
#   This creates a 32-bit revocation ID where the lower 24 bits come from CFPA and
#   the upper 8 bits come from OTP fuses.

# **Note:** Despite these different validation mechanisms across device types and use cases,
# a single "fuse_version" field name is used for consistency and simplicity in the configuration
# schema, as all scenarios serve the same fundamental purpose of preventing rollback attacks
# through monotonic counter validation.
fuse_version: 0
# -----------------------------------===== Certificate public key 0 [Required] =====------------------------------------
# Description: Path to Public key 0 file.
public_key_0: inputs/dck_ecc384.pub
# -------------------------------------------===== Signer 0 [Required] =====--------------------------------------------
# Description: Signature provider configuration in format 'type=<identifier>;<key1>=<value1>;<key2>=<value2>' or the
# private key 0 used for signing the certificate container.
signer_0: ../../_data/keys/ecc384/srk0_ecc384.pem
# ---------------------------------------===== Hash Algorithm 0 [Optional] =====----------------------------------------
# Description: Hash algorithm used for SRK records. If not specified, default algorithm based on key type will be used.
# Possible options: <default, sha256, sha384, sha512, sm3, sha3_256, sha3_384, sha3_512, shake_128_256, shake_256_512>
hash_algorithm_0: default
# -------------------------------------------===== CA Flag 0 [Optional] =====-------------------------------------------
# Description: CA Flag is used by HAB to indicate if the SRK is allowed to sign other keys. In AHAB CA Flag only affects
# the final SRKH (Super Root Key Hash) value burned into chip fuses. It is not used in the AHAB signing process itself.
# This option exists only for compatibility with systems where fuses are already programmed. In most cases, this should
# remain false.
flag_ca_0: false
# -----------------------------------===== Certificate public key 1 [Optional] =====------------------------------------
# Description: Path to Public key 1 file.
public_key_1: inputs/dck_mldsa65.pub
# -------------------------------------------===== Signer 1 [Optional] =====--------------------------------------------
# Description: Signature provider configuration in format 'type=<identifier>;<key1>=<value1>;<key2>=<value2>' or the
# private key 1 used for signing the certificate container.
signer_1: ../../_data/keys/mldsa65/srk0_mldsa65.pem
# ---------------------------------------===== Hash Algorithm 1 [Optional] =====----------------------------------------
# Description: Hash algorithm used for SRK records. If not specified, default algorithm based on key type will be used.
# Possible options: <default, sha256, sha384, sha512, sm3, sha3_256, sha3_384, sha3_512, shake_128_256, shake_256_512>
hash_algorithm_1: default
# -------------------------------------------===== CA Flag 1 [Optional] =====-------------------------------------------
# Description: CA Flag is used by HAB to indicate if the SRK is allowed to sign other keys. In AHAB CA Flag only affects
# the final SRKH (Super Root Key Hash) value burned into chip fuses. It is not used in the AHAB signing process itself.
# This option exists only for compatibility with systems where fuses are already programmed. In most cases, this should
# remain false.
flag_ca_1: false
