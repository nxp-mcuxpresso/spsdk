# =====================  DEVHSM (Device HSM) provisioning SB file configuration for mcxn946  ======================
# NXP chip family identifier.
family: mcxn946
# Revision of silicon.
revision: latest
# Part Common Key / CUST_MK_SK - 256-bit customer master symmetric key. It is the same key that is
# used to encrypt the SB3.1 file in this example (see sb31_config.yaml), so the device is able to
# decrypt it. Here it is provided as a plain hex string for demonstration purposes only.
containerKeyBlobEncryptionKey: pck.txt
# Reset the device before starting the DEVHSM operation.
initialReset: false
# Reset the device after the DEVHSM operation, so the provisioning SB file can be received.
finalReset: true
# Path where to store the generated DEVHSM provisioning SB file.
containerOutputFile: ../workspace/mcxn9xx_devhsm.sb
# Minimal provisioning steps: load the chip configuration (CMPA/CFPA). The CUST_MK_SK key blob
# load command is injected automatically from 'containerKeyBlobEncryptionKey'.
commands:
  # Load CMPA (contains the RKTH / Root of Trust).
  - load:
      address: 0x0100_4000
      file: ../workspace/cmpa.bin
  # Load CFPA.
  - load:
      address: 0x0100_0000
      file: ../workspace/cfpa.bin
