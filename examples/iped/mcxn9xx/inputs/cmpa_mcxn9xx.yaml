# ======================  PFR CMPA configuration for mcxn946 (external IPED encryption)  ======================
# IPED (In-line PRINCE Encryption/Decryption) encrypts a region of the external FlexSPI flash on the fly.
# Here IPED region 0 covers the external XIP image at 0x80001000..0x80010000 in CTR mode. The region
# start must match the MBI execution address. The RKTH is taken from the referenced certificate block.
family: mcxn946
revision: latest
type: CMPA
settings:
  IPED0_START:
    # CTR mode (use ENABLE_GCM_MODE for authenticated GCM mode).
    GCM_MODE: ENABLE_CTR_MODE
    # Generate an AHB bus error if a GCM authentication fails.
    AHBERR_DIS: ENABLED
    # Start address of the encrypted external-flash region.
    IPED_CTX0_START_ADDR: '0x80001000'
  IPED0_END:
    # Do not lock the region so the example can be repeated.
    LOCK_EN: NOT_LOCKED_0b00
    # End address of the encrypted external-flash region.
    IPED_CTX0_END_ADDR: '0x80010000'
