# ===========  AHAB converted config.  ===========
# First container is signed by NXP keys (SRKH fuse generation is always
# skipped for NXP/DEVHSM containers), second container is signed by OEM
# keys using the *same* SRK table as the NXP container. This reproduces
# the edge case where the SRK hash of container 0 matches the SRK hash of
# the other containers, even though container 0 itself must never produce
# SRKH fuse files (SPSDK-6159).
family: mimxrt1189 # [Required], MCU family
revision: a0 # [Optional], MCU revision
target_memory: standard # [Required], Type of image
output: multi_container_nxp_first_ahab.bin # [Required], Output file name
containers: # [Required], List of containers present in AHAB
  - container: # [Required], AHAB Container - signed by NXP, must never produce SRKH fuse files
      srk_set: nxp
      used_srk_id: 0
      srk_revoke_mask: 0
      fuse_version: 0
      sw_version: 0
      signer: ../../_data/keys/ecc256/srk0_ecc256.pem
      images:
        - image_path: ahab/fuses_scripts/dummy_data.bin
          image_offset: 0
          load_address: 2
          entry_point: 1
          image_type: executable
          core_id: cortex-m33
          hash_type: sha512
      srk_table:
        srk_array:
          - ../../_data/keys/ecc256/srk0_ecc256.pub
          - ../../_data/keys/ecc256/srk1_ecc256.pub
          - ../../_data/keys/ecc256/srk2_ecc256.pub
          - ../../_data/keys/ecc256/srk3_ecc256.pub
  - container: # [Required], AHAB Container - signed by OEM, same SRK table as the NXP container
      srk_set: oem
      used_srk_id: 0
      srk_revoke_mask: 0
      fuse_version: 0
      sw_version: 1
      signer: ../../_data/keys/ecc256/srk0_ecc256.pem
      images:
        - image_path: ahab/fuses_scripts/dummy_data.bin
          image_offset: 0
          load_address: 2
          entry_point: 1
          image_type: executable
          core_id: cortex-m33
          hash_type: sha512
      srk_table:
        srk_array:
          - ../../_data/keys/ecc256/srk0_ecc256.pub
          - ../../_data/keys/ecc256/srk1_ecc256.pub
          - ../../_data/keys/ecc256/srk2_ecc256.pub
          - ../../_data/keys/ecc256/srk3_ecc256.pub
