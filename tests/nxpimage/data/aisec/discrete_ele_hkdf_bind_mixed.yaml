# Generated by the AISEC reference builder cross-check; container_salt is fixed
# for reproducibility only (it must be random in production).
family: mimx9596
output: output/discrete_ele_hkdf_bind_mixed.bin
container:
  flow: discrete
  mode: ele_primitive_backend
  container_id: '0x5A5A0001'
  container_version: 3
crypto:
  enc_key_size: 32
  auth_key_size: 32
  kdf: hkdf_sha256
  binding: true
  container_salt: a5a5a5a55a5a5a5a0123456789abcdef
keys:
  mmk_id: '0x0A15EC01'
  mmk_size: 32
  mmk: keys/mmk_aes256.bin
  srkh: keys/srkh.bin
members:
  src_dir: model
  default:
    protection: enc_auth
    block_size: b256k
  rules:
  - match: '*.json'
    protection: auth_only
    block_size: b64k
  - match: LICENSE
    protection: none
    block_size: b64k
