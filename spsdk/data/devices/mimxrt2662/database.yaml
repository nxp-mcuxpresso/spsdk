revisions:
  a0: {}
latest: a0

# General MCU information
info:
  purpose: i.MX RT Crossover MCUs
  spsdk_predecessor_name: rt266x
  memory_map:
    flexspi1_ns:
      start_int: 0x60000000
      size_int: 0x08000000
      external: true
      mirror_of: flexspi1_s
    flexspi1_s:
      start_int: 0x70000000
      size_int: 0x08000000
      external: true
    flexspi2_ns:
      start_int: 0x80000000
      size_int: 0x08000000
      external: true
      mirror_of: flexspi2_s
    flexspi2_s:
      start_int: 0x90000000
      size_int: 0x08000000
      external: true
  isp:
    rom:
      protocol: mboot
      interfaces: [uart, usb]
      usb:
        - vid: 0x1FC9
          pid: 0x014C
    flashloader:
      protocol: mboot
      interfaces: [uart, usb]
      usb:
        - vid: 0x15A2
          pid: 0x0073

features:
  # ======== Debug probe access section ========
  debug_probe:
    protocols: [swd, jtag]
    test_address: 0x2208_0000

  # ======== Blhost section ========
  blhost: {}

  # ======== Communication buffer section ========
  comm_buffer:
    address: 0x2200_0000
    size: 0xc000

  # ======== Certificate block section ========
  cert_block:
    sub_features: [based_on_srk]
    rot_type: "srk_table_ahab_v2"

  # ======== DAT section ========
  dat:
    socc: 0x52540A64 # SOCC identification
    based_on_ele: True # Flag if the implementation of DAT is based on EdgeLock Enclave
    ele_cnt_version: 2 # DAT container is based on New AHAB container version 2
    dac_version_is_swapped: True
    auth_beacon_length: 4 # The length in bytes of authentication beacon
    sub_features: ["ele_pqc"]
    test_address: 0x2208_0000
    dmbox_ap_ix: 0

  # ======== AHAB section ========
  ahab:
    sub_features: [ahab_image, certificate_supported, offline_keyblob]
    container_types: [2] # Supported container types
    core_ids:
      CORTEX_M85: [1, "cortex-m85", "Cortex M85"]
      ELE: [6, "ele", "EdgeLock Enclave"]
    image_types:
      application:
        EXECUTABLE: [0x03, executable, Executable Image]
        DATA: [0x04, data, Data Image]
        PROVISIONING_IMAGE: [0x07, provisioning_image, Provisioning Image]
        PROVISIONING_DATA: [0x09, provisioning_data, Provisioning data Image]
      ele:
        ELE_AS_IMAGE: [0x05, ele_as_image, EdgeLock Enclave Image in OEM Image]
        ELE: [0x06, ele, EdgeLock Enclave Image]

    image_types_mapping:
      ele: [6]

    allow_empty_hash: True
    allow_key_mix: True
    offline_keyblob_constant: "2660 S110A0"
    # ROM expects the first data image at offset 0x9000
    start_image_address: 0x9000

    signature_algorithms:
      RSA: [0x21, "RSA", "RSA signature algorithm"]
      RSA_PSS: [0x22, "RSA_PSS", "RSA PSS signature algorithm"]
      ECDSA: [0x27, "ECDSA", "ECDSA signature algorithm"]
      SM2: [0x28, "SM2", "SM2 signature algorithm"]
      # V2 only
      DILITHIUM: [0xD1, "DILITHIUM", "Dilithium PQC algorithm"]
      ML_DSA: [0xD2, "ML-DSA", "ML-DSA PQC algorithm"]
      LMS: [0xD3, "LMS", "Leighton-Micali Signature scheme"]

  # ======== IPED section ========
  iped:
    iped_version: 2
    table_size: 0x400
    raw_table_size: 0x30
    max_contexts: 16
    min_contexts: 1
    address_alignment: 0x100
    interleaved_gcm_tags: true
    rom_config_blob: true
    prince_v2_model: true
    backend_device: rt2660_a0
    backend_instance: xspi0
    prince_v2_models:
      xspi0:
        duplicate_address: true
        sbox_t0: 0x7c63e5b289f104da
        sbox_t1: 0xdb0a179546ef2c38
        inverse_sbox_t0: 0xcb73d52089f61e4a
        inverse_sbox_t1: 0xcb73d52089f61e4a
