    derivation_instance_map:
      xspi0: 0x70F7CA00
      xspi1: 0x0F0835FF

  # ======== XMCD section ========
  xmcd:
    header:
      reg_spec: ../../common/xmcd/xspi_ram_header.json
    mem_types:
      xspi_ram:
        simplified:
          reg_spec: ../../common/xmcd/xspi_ram_simplified.json

  # ======== FCB section ========
  fcb:
    mem_types:
      xspi_nor:
        reg_spec: fcb_xspi_nor.json

  # ======== Bootable image section ========
  bootable_image:
    mem_types:
      serial_downloader:
        segments:
          xmcd: 0x00
          ahab_container: 0x400
      xspi_nor:
        segments:
          keyblob: 0x0000
          fcb: 0x0400
          xmcd: 0x0A00
          ahab_container: 0x1000
      xspi_nand:
        segments:
          xmcd: 0x00
          ahab_container: 0x400
      emmc:
        segments:
          #secondary_image_table: 0x200 (not used)
          xmcd: 0x400
          ahab_container: 0x800
      sd:
        segments:
          #secondary_image_table: 0x200 (not used)
          xmcd: 0x400
          ahab_container: 0x800

  # ======== EdgeLock Enclave section ========
  ele:
    ele_device: mboot

  # ======== Misc signing section ========
  signing:
    pss_padding: true

  # ======== Fuses description section ========
  fuses:
    tool: blhost

  # ======== Memory configuration ========
  memcfg:
    peripherals:
      xspi_nand:
        instances: [0, 1]
      xspi_nor:
        instances: [0, 1]
      sd:
        instances: [0, 1]
        interfaces: [instance_0, instance_1]
      emmc:
        instances: [0, 1]
        interfaces: [instance_0, instance_1]
