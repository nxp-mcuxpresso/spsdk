revisions:
  a0: {}

latest: a0

# General MCU information
info:
  use_in_doc: True
  purpose: i.MX RT Crossover MCUs
  # Web page of MCU representative
  web: https://www.nxp.com
  memory_map: # Memory map basic info
    itcm:
      start_int: "0x0"
      size_int: "0x40000"
      external: false
      non_xip_type: int_ram
    sram:
      start_int: "0x20000000"
      size_int: "0x40000"
      external: false
      non_xip_type: int_ram
    shared_ram:
      start_int: "0x21000000"
      size_int: "0x280000"
      external: false
      non_xip_type: int_ram
    xspi0:
      start_int: "0x60000000"
      size_int: "0x10000000"
      external: true
    xspi1:
      start_int: "0x80000000"
      size_int: "0x10000000"
      external: true
  isp:
    rom:
      protocol: mboot
      interfaces: ["uart", "spi", "i2c"]

features:
  # ======== Blhost section ========
  blhost: {}

  # ======== Communication buffer section ========
  comm_buffer:
    address: 0x2001_8000
    size: 0x1000

  # ======== Certificate block section ========
  cert_block:
    sub_features: [based_on_srk]
    rot_type: "srk_table_ahab_v2_48_bytes"

  ahab: &ahab_common_config
    sub_features: [certificate_supported]
    container_types: [2] # Supported container types
    containers_max_cnt: 1
    image_types_mapping: {}
    certificate_type: 32bit_fuse_version # The certificate with full 32-bit fuse version support
    fuses_0:
      _name: "AHAB SRKH"
      rkth: "__srk_hash0" # CUST_RKTH fuses
    fuses_1:
      _name: "AHAB PQC SRKH"
      pqc_rkth: "__srk_hash1" # CUST_PQC_RKTH fuses
    allow_empty_hash: False
    core_ids:
      CORTEX_M55: [1, "cortex-m55", "Cortex M55 - Boot core"]

    valid_offset_minimal_alignment: 4
    extra_containers: []
    image_hash_types: [sha384] # Supported image hash types
    iae_has_signed_offsets: True
    signature_algorithms:
      __replace__: true
      ECDSA: [0x27, "ECDSA", "ECDSA signature algorithm"]
      ML_DSA: [0xD2, "ML-DSA", "ML-DSA PQC algorithm"]

  # ======== Debug probe access section ========
  debug_probe:
    test_address: 0x2001_8000
    # mem_ap_index is intentionally left at the default (-1) so the ADIv6 ROM
    # walk auto-discovers the MEM-AP base address from the CoreSight ROM tables.
    # If the auto-enumeration fails on HW, uncomment the line below to force the
    # MEM-AP base address (0x2000 = AHB-AP CSS Cortex on this SoC):
    mem_ap_index: 0x2000 # AHB-AP CSS cortex (ADIv6 memory-mapped AP base)



  # ======== DAT (Debug Authentication) section ========
  # Safe baseline configuration to enable the nxpdebugmbox commands (debug
  # mailbox: start, get-crp, ...). This device is an EdgeLock (ELE) / AHAB
  # based part and uses ARM ADIv6 (CoreSight 600 / DPv3) debug topology.
  #
  # On ADIv6 the debug mailbox AP is memory-mapped (base address) instead of a
  # classic ADIv5 APSEL index. The SPSDK ARM base class auto-enumerates the AP
  # base addresses from the CoreSight ROM tables, so dmbox_ap_ix is left at the
  # default (-1 = not used for ADIv6). If auto-enumeration fails on the target,
  # the AP base addresses can be forced from the CLI, for example:
  #   nxpdebugmbox -i jlink -o adiv6_ap_addresses=0x2000,0xA000,0x1D00 ...
  # where 0x1D00 is the NXP debug mailbox AP base on this SoC.
  dat:
    based_on_ele: True # DAT is implemented on top of the EdgeLock Enclave
    dat_is_using_sha256_always: True # ELE DAT uses SHA-256
    dac_rot_type: not_available # DAC packet does not contain the ROT hash
    # dmbox_ap_ix is left at the default (-1). On ADIv6 the debug mailbox AP is
    # auto-discovered by the ROM walk via its AP IDR (0x002A0000). If the
    # auto-enumeration fails on HW, uncomment the line below to force the debug
    # mailbox AP base address (0x1D00 = DM-AP on this SoC):
    dmbox_ap_ix: 0x1D00 # DM-AP debug mailbox (ADIv6 memory-mapped AP base)




  # ======== Fuses description section ========
  fuses:
    grouped_registers:
      - uid: cust_mk_sk
        name: CUST_MK_SK
        width: 384
        config_as_hexstring: true
        reversed: false
        description:
          CUST_MK_SK is stored in form of RFC3394 blob and it is used by the boot ROM to decrypt
          the SB4 encryption key during processing of an SB file.
        sub_regs:
          - fuse99
          - fuse100
          - fuse101
          - fuse102
          - fuse103
          - fuse104
          - fuse105
          - fuse106
          - fuse107
          - fuse108
          - fuse109
          - fuse110
      - uid: rkth
        name: RKTH
        width: 384
        config_as_hexstring: true
        reversed: true
        alternative_widths: [256]
        description:
          CUST_RKTH field is compounded by 12 32-bit fuses and contains the Root key table hash.
          For ECC P-256 keys RKTH is a 32-byte SHA-256 digest, for ECC P-384 keys RKTH is a
          48-byte SHA-384 digest of the four OEM root public keys.
        sub_regs:
          - fuse111
          - fuse112
          - fuse113
          - fuse114
          - fuse115
          - fuse116
          - fuse117
          - fuse118
          - fuse119
          - fuse120
          - fuse121
          - fuse122
      - uid: pqc_rkth
        name: PQC_RKTH
        width: 384
        config_as_hexstring: true
        reversed: true
        description:
          CUST_PQC_RKTH field is compounded by 12 32-bit fuses and contains the Root key table
          hash of the post-quantum (ML-DSA) root public keys.
        sub_regs:
          - fuse123
          - fuse124
          - fuse125
          - fuse126
          - fuse127
          - fuse128
          - fuse129
          - fuse130
          - fuse131
          - fuse132
          - fuse133
          - fuse134

  # ======== MBI section ========
  mbi:
    mbi_classes:
      plain_xip:
        image_type: PLAIN_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinIvt
          - Mbi_MixinTrustZoneV2
          - Mbi_MixinLoadAddress
          - Mbi_MixinFwVersionHiddenImageVersion
          - Mbi_ExportMixinAppTrustZoneV2
      plain_ram:
        image_type: PLAIN_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinIvt
          - Mbi_MixinTrustZoneV2
          - Mbi_MixinLoadAddress
          - Mbi_MixinFwVersionHiddenImageVersion
          - Mbi_ExportMixinAppTrustZoneV2
      crc_ram:
        image_type: CRC_RAM_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinIvt
          - Mbi_MixinTrustZoneV2
          - Mbi_MixinLoadAddress
          - Mbi_MixinFwVersionHiddenImageVersion
          - Mbi_ExportMixinAppTrustZoneV2
          - Mbi_ExportMixinCrcSignEnd
      crc_xip:
        image_type: CRC_XIP_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinIvt
          - Mbi_MixinLoadAddress
          - Mbi_MixinTrustZoneV2
          - Mbi_MixinFwVersionHiddenImageVersion
          - Mbi_ExportMixinAppTrustZoneV2
          - Mbi_ExportMixinCrcSignEnd
      signed_xip:
        image_type: SIGNED_XIP_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinTrustZoneV2
          - Mbi_MixinIvt
          - Mbi_MixinLoadAddress
          - Mbi_MixinFwVersionHiddenImageVersion
          - Mbi_MixinAppCrc
          - Mbi_MixinAhab
          - Mbi_ExportMixinAppTzCrcAhab
    images:
      xip:
        plain: plain_xip
        crc: crc_xip
        signed: signed_xip
      load_to_ram:
        plain: plain_ram
        crc: crc_ram
    ahab:
      <<: *ahab_common_config
      oem_images_max_cnt: 3
      image_types:
        application:
          CRC_CHECK: [0x01, crc_check, CRC fast data check]
          EXECUTABLE: [0x03, executable, Executable Image]
          TZ_DATA: [0x05, tz_data, Trust Zone Preset data]

  # ======== Secure binary v4.0 section ========
  sb40:
    supported_commands:
      - erase
      - load
      - execute
      - programFuses
      - copy
      - loadKeyBlob
      - configureMemory
      - fillMemory
      - checkFwVersion
      - reset

    variable_block_length: true
    commands_block_length: 4096
    supports_compression: true

    ahab:
      <<: *ahab_common_config
      oem_images_max_cnt: 1
      image_types:
        application:
          SB40_DESCRIPTOR: [0x0f, secure_binary_4, Secure binary 4.0]

  # ======== Bootable image section ========
  bootable_image:
    mem_types:
      xspi_nor:
        segments:
          fcb: 0x0000
          xmcd: 0x0300
          mbi: 0x4000

  # ======== FCB section ========
  fcb:
    mem_types:
      xspi_nor:
        reg_spec: ../mimxrt798s/fcb_xspi_nor_b0.json

  # ======== XMCD section ========
  xmcd:
    header:
      reg_spec: ../../common/xmcd/xspi_ram_header.json
    mem_types:
      xspi_ram:
        simplified:
          reg_spec: ../../common/xmcd/xspi_ram_simplified.json

  # ======== TrustZone section ========
  tz:
    version: v2 # TrustZone configuration version v2.0

  # ======== Device Hardware Security Module (HSM) section ========
  devhsm:
    sub_features: [DevHsmSB4]
    key_blob_offset: 0
    key_blob_command_position: -1
    key_wraps_version: 2
    devbuff_wrapped_cust_mk_sk_key_size: 0x30
    supported_commands:
      - erase
      - load
      - execute
      - programFuses
      - copy
      - loadKeyBlob
      - configureMemory
      - fillMemory
      - checkFwVersion
      - reset
