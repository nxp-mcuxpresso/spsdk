alias: mcxl255

# General MCU information
info:
  use_in_doc: True # Include this MCU in generated documentation
  purpose: MCX Series
  # Web page of MCU representative
  web: https://www.nxp.com
  memory_map: # Memory map basic info
    internal-flash:
      start_int: 0x0
      size_int: 0x4_0000
      external: false
    sram:
      start_int: 0x2000_0000
      size_int: 0x1_0000
      external: false

features:
  # ======== PFR section ========
  pfr:
    cmpa: # CMPA description
      address: 0x5_E000
      # 256K-phantom variant of the mcxl253 device. SI base = CMPA - 0x18000 = 0x46000.
      si_probe_address: 0x46000
    cfpa: # CFPA description
      address: 0x5_FFF0