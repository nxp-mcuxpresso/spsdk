revisions:
  a0: {}
latest: a0

# General MCU information
info:
  use_in_doc: True # Include this MCU in generated documentation
  purpose: MCX Series
  # Web page of MCU representative
  web: https://www.nxp.com/products/processors-and-microcontrollers/arm-microcontrollers/general-purpose-mcus/mcx-arm-cortex-m:MCX-MCUS
  memory_map: # Memory map basic info #TODO check it
    internal-flash:
      start_int: 0x0
      size_int: 0x2_0000
      external: false
    sram:
      start_int: 0x2000_0000
      size_int: 0x4000
      external: false
      non_xip_type: int_ram
  isp:
    rom:
      protocol: null
      interfaces: []

features:
  # ======== Debug probe access section ========
  debug_probe: {}

  # ======== Communication buffer section ========
  comm_buffer:
    address: 0x2000_0000
    size: 0x1000

  # ======== MBI section ========
  mbi:
    misr_data_alignment: 0x10
    misr_seed_byte_order: big
    mbi_classes:
      plain_xip:
        image_type: PLAIN_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinMisrIvt
          - Mbi_ExportMixinApp
      crc_xip:
        image_type: CRC_XIP_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinMisrIvt
          - Mbi_ExportMixinApp
          - Mbi_ExportMixinCrcSign
      misr_xip:
        image_type: MISR_IMAGE
        mixins:
          - Mbi_MixinApp
          - Mbi_MixinMisrIvt
          - Mbi_ExportMixinApp
          - Mbi_ExportMixinMisrSign
    images:
      xip:
        plain: plain_xip
        crc: crc_xip
        misr: misr_xip

  # ======== PFR section ========
  pfr:
    sub_features: [cmpa_cfg, cmpa_pswd, cmpa_lc]
    cmpa_cfg:
      address: 0x0100_2000
      reg_spec: cmpa_cfg.json
      computed_fields:
        field070: pfr_calculate_crc # CRC

    cmpa_pswd:
      address: 0x0100_2800
      reg_spec: cmpa_pswd.json
      grouped_registers:
        - uid: dbg_auth_password
          name: DBG_AUTH_PASSWORD
          width: 128
          config_as_hexstring: true
          reverse_subregs_order: True
          description: DBG_AUTH_PASSWORD[127:0]
          sub_regs:
            - field010
            - field014
            - field018
            - field01C
        - uid: img_misr_seed
          name: IMG_MISR_SEED
          width: 128
          config_as_hexstring: true
          description: IMG_MISR_SEED[127:0]
          sub_regs:
            - field020
            - field024
            - field028
            - field02C
        - uid: erase_password
          name: ERASE_PASSWORD
          width: 128
          config_as_hexstring: true
          reverse_subregs_order: True
          description: ERASE_PASSWORD[127:0]
          sub_regs:
            - field030
            - field034
            - field038
            - field03C
      computed_fields:
        field040: pfr_calculate_crc # CRC

    cmpa_lc:
      address: 0x0100_3000
      size: 16
      reg_spec: cmpa_lc.json

  # ======== DAT section ========
  dat:
    dmbox_ap_ix: 1
    sub_features:
      - password_auth
      - program_lifecycle
    program_lifecycle:
      pfr_area: cmpa_lc
      register: LIFECYCLE_STATE
      allowed_states: [IN_FIELD1, IN_FIELD2, IN_FIELD_LOCKED]
      dangerous_states: [BRICKED]
      forbidden_states: [DEVELOP]
    non_standard_statuses:
      2: # GET_CRP_LEVEL
        0x00: NXP_BLANK
        0x01: NXP_FAB
        0x03: DEVELOP
        0x07: IN_FIELD1
        0x0F: IN_FIELD2
        0x7F: NXP_FIELD_RETURN
        0xCF: IN_FIELD_LOCKED
        0xFC: NXP_DEV
        0xFF: SHREDDED (alias BRICKED)

  # ======== Blhost section ========
  blhost:
    sub_features: [overridden_properties]
    overridden_properties:
      17: "life-cycle"

  # ======== Bootable image section ========
  bootable_image:
    mem_types:
      internal:
        segments:
          mbi: 0x00

